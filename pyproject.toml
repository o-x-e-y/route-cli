[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "route-cli"
version = "0.1.0"
description = "Public transport routes in the Netherlands, door to door, for agents"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
route = "route.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/route"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "RUF"]
